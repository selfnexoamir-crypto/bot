services:
  - type: worker
    name: axiom-viewbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: OWNER_USER_ID
        sync: false
      - key: VIEW_DELAY_SECONDS
        value: "3"
      - key: VIEWS_PER_OPEN
        value: "20"
      - key: PROXY_TIMEOUT
        value: "10"
